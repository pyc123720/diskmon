name: Bug report
description: 出错了 / 行为不对 / 清理结果和预期不一致
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        先谢过。填得越全，我修得越快 —— 这是一个人维护的项目，来回追问一轮就要多花一天。

        **最省事的一步**：在 exe 所在目录运行 `diskmon-go.exe diag`，它会生成一个
        `diag-<时间>.txt`。把这个文件的内容粘到下面「诊断包」里，版本 / 系统 / 数据目录 /
        上次扫描 / 告警 / 日志尾巴就都有了。
  - type: input
    id: version
    attributes:
      label: 版本
      description: "`diskmon-go.exe health` 输出的版本号，或看托盘菜单"
      placeholder: "例如 2.5.5"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: "Win+R 输入 `winver` 能直接看到"
      placeholder: "例如 Windows 11 24H2 (26100.1742)"
    validations:
      required: true
  - type: dropdown
    id: admin
    attributes:
      label: 是否以管理员身份运行
      options:
        - 是
        - 否
        - 不确定
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: 诊断包（diskmon-go.exe diag 生成的内容）
      description: |
        内容里有本机路径和程序名，贴之前可以自己删掉不想公开的行。
        不想贴全文的话，至少贴「版本与环境」「最后一次扫描」「日志最后 80 行」三段。
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 实际发生了什么
      description: 一句话说清现象。有具体数字就写数字（比如「计划 4.2 GB，实际 12 MB」）。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 清理 → 一键方案
        2. 点「演练并执行 保守」
        3. ...
  - type: dropdown
    id: cleanup
    attributes:
      label: 和清理有关吗
      options:
        - 无关，只是监测/界面
        - 有关：隔离区 / 懒人清理 / 三档方案
        - 有关：L2 自动规则（请写明规则名）
        - 有关：还原 / 撤销
    validations:
      required: true
  - type: textarea
    id: quarantine
    attributes:
      label: 如果涉及误删或数据丢失
      description: |
        **先别重启、先别清隔离区**。文件还在 `<数据目录>\quarantine` 里，7 天内都能还原。
        把隔离项 id（隔离区页面能看到）贴在这里。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我用的不是旧版本（Release 页是最新的）
          required: true
        - label: 我搜过现有 issue，没有重复
          required: true
